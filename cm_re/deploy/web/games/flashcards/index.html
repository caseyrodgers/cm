<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title></title>
    <script src="jquery.js"></script>
    <script src="flashcard_problemGenerator.js"></script>
    <script>
    var fcm
        $(document).ready(function(){
        fcm=new FC_Manager($("div[name='fc_container']").get(0),'adding_fractions',{limit:3,helpCont:$("div[name='fc_help_container']")})
        fcm.init();
        
        });
        function showNext(){
            fcm.showProblem();
        }
        function showExplain(){
            fcm.showHelp();
        }
    </script>
    <style>
        .qblock{
            float:left;
        }
        .ablock{
            float:left;
        }
        .ablock input {
            font-family: Helvetica,Arial;
            font-size: 15pt;
            width: 75px;
        }
        .iblock{
            height: 100px;
            padding-top: 10%;
            text-align: center;
            width: 100px;
            
        }
        
        .eqnLine {
            padding: 5px 0;
            font-size:0.75em;
        }
        .question{
            font-size:1.5em;
        }
    </style>
  </head>
  <body>
<div name ="fc_container" style="width:300px;height:200px;border:1px solid red;position:absolute;top:100px;left:100px;font-size:2em;padding:20px;"></div>
<div name ="fc_help_container" style="width:300px;height:200px;border:1px solid blue;position:absolute;top:100px;left:100px;padding:20px;background:white;font-size:10pt;display:none"></div>
<div style="position:absolute;top:345px;left:100px;"><button onclick="showExplain()">Explain</button><button onclick="showNext()" >Next</button></div>
  </body>
</html>
